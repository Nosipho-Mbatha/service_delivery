<div style="background-color: #0056b3; color: white; padding: 15px; text-align: center;">

<style>
    body { font-family: Arial; background: #f4f4f4; }

    .search-bar { width: 100%; padding: 10px; margin-bottom: 10px; }
    .map { height: 150px; background: #ddd; text-align: center; padding-top: 60px; margin-bottom: 10px; }
    .input { width: 100%; padding: 10px; margin-bottom: 10px; }
    .grid { display: flex; gap: 10px; }
    .box { flex: 1; padding: 20px; background: white; text-align: center; border: 2px solid #ccc; }
    .error { border-color: red; }
    .submit { width: 100%; padding: 10px; margin-top: 10px; }
</style>

    <input class="search-bar" placeholder="Search services...">

    <p>Select Category:</p>

    <div class="grid">
        <!-- AI IMPROVEMENT: Validation -->
        <div class="box error">💧 Water <br><small>* Required</small></div>
        <div class="box">⚡ Electricity</div>
        <div class="box">🛣️ Roads</div>
    </div>

    <button class="submit" disabled>Submit Report</button>
